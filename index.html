<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep Warm</title>
<meta name="description" content="Who to text this month, so connections stay warm.">
<meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --text: #2a2420;
    --muted: #8a7f76;
    --line: #e8e0d7;
    --accent: #e0662f;
    --accent-ink: #ffffff;
    --due: #fbe9df;
    --ok: #3f8f5a;
    --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 2px 8px rgba(40, 30, 20, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1714;
      --card: #24201c;
      --text: #f1ebe4;
      --muted: #9d9289;
      --line: #36302a;
      --accent: #f07a43;
      --accent-ink: #1a1714;
      --due: #3a2619;
      --ok: #6cc28a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1714; --card: #24201c; --text: #f1ebe4; --muted: #9d9289;
    --line: #36302a; --accent: #f07a43; --accent-ink: #1a1714; --due: #3a2619;
    --ok: #6cc28a; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
  }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  header p { margin: 4px 0 20px; color: var(--muted); }

  form.add {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-bottom: 28px;
  }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=date], select {
    min-width: 0;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 10px 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.ghost { background: none; border: none; color: var(--muted); padding: 6px 8px; }
  @media (max-width: 420px) {
    form.add { grid-template-columns: 1fr auto; }
    form.add input { grid-column: 1 / -1; }
  }

  section { margin-bottom: 28px; }
  section h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 0 10px; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  @media (min-width: 760px) {
    section > ul { grid-template-columns: 1fr 1fr; }
    section > ul > li.empty { grid-column: 1 / -1; }
  }
  li.person {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px 12px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  #due li.person { background: var(--due); }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .late { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); padding: 14px 16px; border: 1px dashed var(--line); border-radius: 14px; }
  .done { color: var(--ok); }

  footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 36px; }
  footer button { font-size: 14px; }

  dialog {
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--card); color: var(--text);
    padding: 20px; width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h3 { margin: 0 0 14px; }
  dialog label { display: grid; gap: 4px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  dialog label > * { color: var(--text); }
  .dialog-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 8px; }
  .danger { color: #c4402f; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
    background: var(--text); color: var(--bg);
    padding: 10px 10px 10px 16px; border-radius: 12px;
    max-width: calc(100vw - 32px);
  }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 600; padding: 4px 8px; }
  .similar {
    margin: -16px 0 28px;
    padding: 12px 14px;
    background: var(--due);
    border: 1px solid var(--accent);
    border-radius: 12px;
    font-size: 14px;
  }
  dialog .similar { margin: 0 0 12px; }
  .similar ul { display: block; margin: 4px 0 10px; padding-left: 18px; list-style: disc; }
  .similar .similar-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .similar button { padding: 6px 12px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Keep Warm 🔥</h1>
    <p id="today"></p>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="addName" placeholder="Add a name" required maxlength="80">
    <select id="addFreq" aria-label="How often">
      <option value="1">Monthly</option>
      <option value="3" selected>Every 3 months</option>
      <option value="6">Every 6 months</option>
      <option value="12">Yearly</option>
    </select>
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="similar" id="addSimilar" role="alert" hidden>
    <strong>Similar name already added:</strong>
    <ul id="addSimilarList"></ul>
    <div class="similar-actions">
      <button type="button" id="addSimilarCancel">Cancel</button>
      <button type="button" class="primary" id="addSimilarConfirm">Add anyway</button>
    </div>
  </div>

  <section id="due">
    <h2><span>Text this month</span><span id="dueCount"></span></h2>
    <ul id="dueList"></ul>
  </section>

  <section id="next">
    <h2><span>Next month</span></h2>
    <ul id="nextList"></ul>
  </section>

  <section id="later">
    <h2><span>Later</span></h2>
    <ul id="laterList"></ul>
  </section>

  <footer>
    <button class="ghost" id="exportBtn" type="button">Export backup</button>
    <button class="ghost" id="importBtn" type="button">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h3>Edit</h3>
    <label>Name <input type="text" id="editName" required maxlength="80"></label>
    <label>How often
      <select id="editFreq">
        <option value="1">Monthly</option>
        <option value="3">Every 3 months</option>
        <option value="6">Every 6 months</option>
        <option value="12">Yearly</option>
      </select>
    </label>
    <label>Last texted <input type="date" id="editLast"></label>
    <div class="similar" id="editSimilar" role="alert" hidden>
      <strong>Similar name already added:</strong>
      <ul id="editSimilarList"></ul>
      <div class="similar-actions">
        <button type="button" id="editSimilarCancel">Cancel</button>
        <button type="button" class="primary" id="editSimilarConfirm">Save anyway</button>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost danger" id="deleteBtn">Delete</button>
      <span>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="undoBtn">Undo</button></div>

<script>
(() => {
  const KEY = 'keepwarm.v1';
  const FREQ_LABEL = { 1: 'monthly', 3: 'every 3 months', 6: 'every 6 months', 12: 'yearly' };
  const $ = id => document.getElementById(id);

  // ---- storage ----
  let people = load();
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(people)); } catch {}
  }

  // ---- dates (month granularity) ----
  const pad = n => String(n).padStart(2, '0');
  const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const monthIndex = iso => { const [y, m] = iso.split('-').map(Number); return y * 12 + (m - 1); };
  const thisMonth = () => monthIndex(isoToday());
  const monthName = idx => new Date(Math.floor(idx / 12), idx % 12, 1)
    .toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const prettyDate = iso => new Date(iso + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

  // Never texted → due now. Otherwise due in the month `freq` months after last text.
  const dueMonth = p => p.last ? monthIndex(p.last) + Number(p.freq) : thisMonth();

  // ---- render ----
  function render() {
    const now = thisMonth();
    $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

    const sorted = [...people].sort((a, b) => dueMonth(a) - dueMonth(b) || a.name.localeCompare(b.name));
    const due = sorted.filter(p => dueMonth(p) <= now);
    const next = sorted.filter(p => dueMonth(p) === now + 1);
    const later = sorted.filter(p => dueMonth(p) > now + 1);

    $('dueCount').textContent = due.length ? due.length : '';
    fill('dueList', due, people.length ? '<span class="done">All caught up this month ✓</span>' : 'Add someone above to get started.');
    fill('nextList', next, 'Nobody yet.');
    fill('laterList', later, 'Nobody yet.');
  }

  function fill(listId, items, emptyHtml) {
    const ul = $(listId);
    ul.replaceChildren();
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.innerHTML = emptyHtml;
      ul.append(li);
      return;
    }
    for (const p of items) ul.append(row(p));
  }

  function row(p) {
    const now = thisMonth();
    const due = dueMonth(p);
    const li = document.createElement('li');
    li.className = 'person';

    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const parts = [FREQ_LABEL[p.freq]];
    parts.push(p.last ? `last ${prettyDate(p.last)}` : 'never texted');
    meta.textContent = parts.join(' · ');
    if (due < now) {
      const late = document.createElement('span');
      late.className = 'late';
      const n = now - due;
      late.textContent = ` · ${n} mo overdue`;
      meta.append(late);
    } else if (due > now + 1) {
      meta.append(` · ${monthName(due)}`);
    }
    who.append(name, meta);

    const edit = document.createElement('button');
    edit.className = 'ghost';
    edit.type = 'button';
    edit.textContent = 'Edit';
    edit.setAttribute('aria-label', `Edit ${p.name}`);
    edit.onclick = () => openEdit(p.id);

    const texted = document.createElement('button');
    texted.type = 'button';
    texted.className = due <= now ? 'primary' : '';
    texted.textContent = 'Texted ✓';
    texted.onclick = () => markTexted(p.id);

    li.append(who, edit, texted);
    return li;
  }

  // ---- similar-name check ----
  // Words: lowercase, accents stripped, split on anything that isn't a letter/digit, single letters ignored.
  const words = name => name.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()
    .split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1);
  // Two words match if equal, or one starts with the other (prefix at least 3 letters).
  const wordsMatch = (a, b) => a === b || (Math.min(a.length, b.length) >= 3 && (a.startsWith(b) || b.startsWith(a)));
  function findSimilar(name, excludeId) {
    const mine = words(name);
    return people.filter(p => p.id !== excludeId && words(p.name).some(w => mine.some(m => wordsMatch(w, m))));
  }
  function showSimilar(listId, boxId, matches) {
    $(listId).replaceChildren(...matches.map(p => {
      const li = document.createElement('li');
      li.textContent = `${p.name} (${FREQ_LABEL[p.freq]}, ${p.last ? `last ${prettyDate(p.last)}` : 'never texted'})`;
      return li;
    }));
    $(boxId).hidden = false;
  }

  // ---- actions ----
  function addPerson() {
    const name = $('addName').value.trim();
    if (!name) return;
    people.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), name, freq: Number($('addFreq').value), last: null });
    save(); render();
    $('addSimilar').hidden = true;
    $('addName').value = '';
    $('addName').focus();
  }
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('addName').value.trim();
    if (!name) return;
    const matches = findSimilar(name);
    if (matches.length) showSimilar('addSimilarList', 'addSimilar', matches);
    else addPerson();
  });
  $('addSimilarConfirm').onclick = addPerson;
  $('addSimilarCancel').onclick = () => { $('addSimilar').hidden = true; $('addName').focus(); };
  $('addName').addEventListener('input', () => { $('addSimilar').hidden = true; });

  let undoState = null, toastTimer = null;
  function markTexted(id) {
    const p = people.find(x => x.id === id);
    if (!p) return;
    undoState = { id, last: p.last };
    p.last = isoToday();
    save(); render();
    showToast(`Nice — ${p.name} is warm again.`);
  }
  function showToast(text) {
    $('toastText').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; undoState = null; }, 5000);
  }
  $('undoBtn').onclick = () => {
    if (!undoState) return;
    const p = people.find(x => x.id === undoState.id);
    if (p) { p.last = undoState.last; save(); render(); }
    undoState = null;
    $('toast').hidden = true;
  };

  let editingId = null;
  function openEdit(id) {
    const p = people.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    $('editName').value = p.name;
    $('editFreq').value = String(p.freq);
    $('editLast').value = p.last || '';
    $('editLast').max = isoToday();
    $('editSimilar').hidden = true;
    $('editDialog').showModal();
  }
  function saveEdit() {
    const p = people.find(x => x.id === editingId);
    if (!p) return;
    p.name = $('editName').value.trim() || p.name;
    p.freq = Number($('editFreq').value);
    p.last = $('editLast').value || null;
    save(); render();
    $('editDialog').close();
  }
  $('editForm').addEventListener('submit', e => {
    e.preventDefault();
    const p = people.find(x => x.id === editingId);
    if (!p) return;
    const name = $('editName').value.trim();
    // Only check when the name actually changed.
    const matches = name && name !== p.name ? findSimilar(name, p.id) : [];
    if (matches.length) showSimilar('editSimilarList', 'editSimilar', matches);
    else saveEdit();
  });
  $('editSimilarConfirm').onclick = saveEdit;
  $('editSimilarCancel').onclick = () => { $('editSimilar').hidden = true; $('editName').focus(); };
  $('editName').addEventListener('input', () => { $('editSimilar').hidden = true; });
  $('cancelBtn').onclick = () => $('editDialog').close();
  $('deleteBtn').onclick = () => {
    const p = people.find(x => x.id === editingId);
    if (p && confirm(`Delete ${p.name}?`)) {
      people = people.filter(x => x.id !== editingId);
      save(); render();
      $('editDialog').close();
    }
  };

  // ---- backup ----
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(people, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `keep-warm-${isoToday()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data) || !data.every(p => p && typeof p.name === 'string' && [1, 3, 6, 12].includes(Number(p.freq)))) throw 0;
      if (!confirm(`Replace your list with ${data.length} people from this backup?`)) return;
      people = data.map(p => ({ id: p.id || String(Date.now() + Math.random()), name: p.name, freq: Number(p.freq), last: p.last || null }));
      save(); render();
    } catch {
      alert("That file doesn't look like a Keep Warm backup.");
    }
  };

  // Re-render when the month rolls over while the tab is open.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();
})();
</script>
</body>
</html>
